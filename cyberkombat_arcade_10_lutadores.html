<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberKombat</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c1446,#05040c 70%);color:#e6e8ff;font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:16px}
#app{width:100%;max-width:1400px}
#ck{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:14px;background:#000;outline:none;touch-action:none;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(120,140,255,.25)}
.ckbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
button{font:inherit;font-size:14px;font-weight:600;color:#e6e8ff;background:rgba(30,32,70,.8);border:1px solid rgba(120,140,255,.35);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{background:rgba(50,54,110,.9)}
button:active{transform:scale(.98)}
.ckhint{font-size:14px;color:#9aa0d0;margin:10px 0 0;line-height:1.5;text-align:center}
.cktouch{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;user-select:none;-webkit-user-select:none}
.cktouch .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cktouch button{height:50px;touch-action:none}
</style>
</head>
<body>
<div id="app">
<canvas id="ck" width="960" height="540" tabindex="0" aria-label="Tela do jogo CyberKombat"></canvas>
<div class="ckbar">
<button id="bSom"><span id="tSom">Som ligado</span></button>
<button id="bVoz"><span id="tVoz">Narrador ligado</span></button>
<button data-logo="senai">Logo SENAI</button>
<button data-logo="inovale">Logo Polo Inovale</button>
<button data-logo="prefeitura">Logo Prefeitura</button>
<input type="file" id="fLogo" accept="image/*" style="display:none">
</div>
<p class="ckhint">Clique no jogo para ativar o teclado. Mova com WASD ou setas e lute com os números: 1 soco, 2 chute, 3 defesa, 4 e 5 especiais, 6 overclock, 7 deletar, 8 amizade.</p>
<div class="cktouch" id="ckTouch">
<div class="pad">
<button data-k="up" style="grid-column:2;grid-row:1">↑</button>
<button data-k="left" style="grid-column:1;grid-row:2">←</button>
<button data-k="down" style="grid-column:2;grid-row:2">↓</button>
<button data-k="right" style="grid-column:3;grid-row:2">→</button>
</div>
<div class="pad">
<button data-k="punch">1 Soco</button><button data-k="kick">2 Chute</button><button data-k="block">3 Defesa</button>
<button data-k="sp1">4 Esp. 1</button><button data-k="sp2">5 Esp. 2</button><button data-k="over">6 Overclock</button>
<button data-k="fin">7 Deletar</button><button data-k="ami">8 Amizade</button><button data-k="start">Iniciar</button>
</div>
</div>
</div>
